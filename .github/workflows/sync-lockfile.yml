name: Synchronize npm lockfile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lockfile for existing React dependencies
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Check lockfile with npm clean install
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Commit corrected lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize package-lock with React 18 dependencies"
          git push origin HEAD:main
